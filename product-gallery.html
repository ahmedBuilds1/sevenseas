<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2340">
<title>Seven Seas Ships &amp; Boats Trading — Product Catalogue</title>
<meta name="description" content="Browse the full Seven Seas Ships & Boats Trading product catalogue and search by product name.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B2340'/%3E%3Cpath d='M32 12c-1.5 0-2.7 1.2-2.7 2.7v16.6l-9.6 5.5c-1 .6-1.4 1.9-.8 2.9l3.2 5.6c.5.9 1.6 1.3 2.6.9 2.2-.9 4.7-1.4 7.3-1.4s5.1.5 7.3 1.4c1 .4 2.1 0 2.6-.9l3.2-5.6c.6-1 .2-2.3-.8-2.9l-9.6-5.5V14.7c0-1.5-1.2-2.7-2.7-2.7z' fill='%231B8A8A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0B2340;
    --navy-soft: #163A5C;
    --teal: #1B8A8A;
    --teal-dark: #146C6C;
    --paper: #FAF9F5;
    --white: #FFFFFF;
    --line: #E3DFD3;
    --ink: #0B2340;
    --ink-2: #5B6570;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(11,35,64,.06), 0 4px 16px rgba(11,35,64,.06);
    --header-h: 128px;
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }

  h1, h2, .brand, .stat-num{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
  }

  a{ color: var(--teal-dark); }

  :focus-visible{
    outline: 2.5px solid var(--teal);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }

  /* ---------- Header ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--navy);
    color: var(--white);
    padding: 14px clamp(16px, 4vw, 32px) 16px;
    box-shadow: 0 2px 20px rgba(11,35,64,.25);
  }

  .header-inner{
    max-width: 1320px;
    margin: 0 auto;
  }

  .brand-row{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .brand{
    font-weight: 700;
    letter-spacing: .01em;
    font-size: clamp(17px, 3.6vw, 21px);
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
  }

  .brand svg{ flex: none; }

  .brand-sub{
    font-size: 12.5px;
    color: #AFC2D6;
    font-weight: 500;
    display: none;
  }

  @media (min-width: 560px){
    .brand-sub{ display: block; }
  }

  .search-wrap{
    position: relative;
  }

  .search-wrap svg.icon-search{
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    opacity: .55;
  }

  #search{
    width: 100%;
    height: 48px;
    border-radius: 10px;
    border: 1.5px solid transparent;
    background: rgba(255,255,255,.96);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 0 44px 0 42px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  #search::placeholder{ color: #8B93A0; }

  #search:focus{
    border-color: var(--teal);
    box-shadow: 0 0 0 4px rgba(27,138,138,.28);
    outline: none;
  }

  #clearBtn{
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #clearBtn:hover{ background: #EEECE3; }
  #clearBtn.show{ display: flex; }

  /* ---------- Status line ---------- */
  .status-row{
    max-width: 820px;
    margin: 18px auto 4px;
    padding: 0 clamp(16px, 4vw, 32px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--ink-2);
    font-size: 13.5px;
  }

  .status-row strong{ color: var(--ink); font-weight: 600; }

  /* ---------- Grid ---------- */
  main{
    max-width: 820px;
    margin: 0 auto;
    padding: 10px clamp(16px, 4vw, 32px) 64px;
  }

  .grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
  }

  @media (min-width: 720px){
    .grid{ gap: 28px; }
  }

  .card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
    display: flex;
    flex-direction: column;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .card:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(11,35,64,.14);
  }
  .card:active{ transform: translateY(0); }

  .thumb{
    width: 100%;
    background: #F1EFE7;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .thumb img{
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 62vh;
    max-height: 62dvh;
    margin: 0 auto;
    background: var(--white);
  }

  @media (min-width: 600px){
    .thumb img{ max-height: 56vh; max-height: 56dvh; }
  }
  @media (min-width: 900px){
    .thumb img{ max-height: 48vh; max-height: 48dvh; }
  }
  @media (min-width: 1300px){
    .thumb img{ max-height: 42vh; max-height: 42dvh; }
  }

  .thumb.broken{
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb.broken::after{
    content: 'Image unavailable';
    font-size: 13px;
    color: var(--ink-2);
  }
  .thumb.broken img{ display: none; }

  .card-body{
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line);
  }

  .card-title{
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.5em;
  }

  .card-page{
    font-size: 11.5px;
    color: var(--ink-2);
    margin-top: 4px;
  }

  /* ---------- Skeletons ---------- */
  .skel{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .skel .thumb{ height: 420px; background: linear-gradient(100deg, #EEEBE1 30%, #F6F4EC 50%, #EEEBE1 70%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @media (min-width: 720px){ .skel .thumb{ height: 620px; } }
  .skel .line{ height: 10px; margin: 12px; border-radius: 4px; background: #EEEBE1; }
  @keyframes shimmer{ from{ background-position: 200% 0; } to{ background-position: -200% 0; } }

  /* ---------- Empty / error ---------- */
  .empty{
    grid-column: 1 / -1;
    text-align: center;
    padding: 72px 20px;
    color: var(--ink-2);
  }
  .empty h2{ color: var(--ink); font-size: 18px; margin: 0 0 8px; }
  .empty p{ margin: 0; font-size: 14px; }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(8,20,36,.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }
  .lightbox.open{ display: flex; }

  .lightbox-inner{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 56px 16px 24px;
  }

  .lightbox img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    background: #fff;
    transition: transform .2s ease;
    touch-action: pinch-zoom;
  }

  .lightbox img.zoomed{ transform: scale(1.9); cursor: zoom-out; }
  .lightbox img:not(.zoomed){ cursor: zoom-in; }

  .lb-close{
    position: absolute;
    top: calc(14px + env(safe-area-inset-top,0));
    right: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .lb-close:hover{ background: rgba(255,255,255,.22); }

  .lb-caption{
    position: absolute;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom,0));
    text-align: center;
    color: #DCE4EC;
    font-size: 13px;
    padding: 0 20px;
  }

  footer{
    text-align: center;
    color: var(--ink-2);
    font-size: 12.5px;
    padding: 28px 16px 40px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-row">
      <span class="brand">
        <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12c-1.5 0-2.7 1.2-2.7 2.7v16.6l-9.6 5.5c-1 .6-1.4 1.9-.8 2.9l3.2 5.6c.5.9 1.6 1.3 2.6.9 2.2-.9 4.7-1.4 7.3-1.4s5.1.5 7.3 1.4c1 .4 2.1 0 2.6-.9l3.2-5.6c.6-1 .2-2.3-.8-2.9l-9.6-5.5V14.7c0-1.5-1.2-2.7-2.7-2.7z" fill="#1B8A8A"/></svg>
        Seven Seas Ships &amp; Boats Trading
      </span>
      <span class="brand-sub">Product catalogue</span>
    </div>
    <div class="search-wrap">
      <svg class="icon-search" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#5B6570" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#5B6570" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Search a product, e.g. kayak, life jacket, Honda engine…" aria-label="Search the product catalogue">
      <button id="clearBtn" type="button" aria-label="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="status-row">
  <span id="statusText">Loading catalogue…</span>
</div>

<main>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer>Seven Seas Ships &amp; Boats Trading LLC · Tap any item to view it full size</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Product image">
  <button class="lb-close" id="lbClose" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
  </div>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
(function(){
  var WEBHOOK_URL = 'https://sevenseas1.app.n8n.cloud/webhook/ab8e01d6-8901-496e-b84b-9596c59ef22e';

  var grid = document.getElementById('grid');
  var statusText = document.getElementById('statusText');
  var searchInput = document.getElementById('search');
  var clearBtn = document.getElementById('clearBtn');
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCaption = document.getElementById('lbCaption');
  var lbClose = document.getElementById('lbClose');

  var debounceTimer = null;
  var currentController = null;
  var requestSeq = 0;

  function extractCaption(text, pageNumber){
    if(!text) return 'Page ' + pageNumber;
    var parts = text.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    var skipPatterns = [/seven seas/i, /www\./i, /trading llc/i, /^specification/i, /^product features/i, /^table of contents/i, /^\d+$/, /exclusive main dealer/i];
    for(var i = 0; i < parts.length; i++){
      var p = parts[i];
      if(p.length < 3) continue;
      var skip = skipPatterns.some(function(re){ return re.test(p); });
      if(!skip) return p.length > 70 ? p.slice(0,68) + '…' : p;
    }
    return 'Page ' + pageNumber;
  }

  function renderSkeletons(count){
    grid.innerHTML = '';
    for(var i = 0; i < count; i++){
      var s = document.createElement('div');
      s.className = 'skel';
      s.innerHTML = '<div class="thumb"></div><div class="line" style="width:80%"></div><div class="line" style="width:40%"></div>';
      grid.appendChild(s);
    }
  }

  function renderEmpty(query){
    grid.innerHTML = '';
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<h2>No matches for "' + escapeHtml(query) + '"</h2><p>Try a shorter word, or check the spelling.</p>';
    grid.appendChild(e);
  }

  function renderError(){
    grid.innerHTML = '';
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<h2>Couldn\u2019t load the catalogue</h2><p>Check your connection and try again.</p>';
    grid.appendChild(e);
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderItems(items){
    grid.innerHTML = '';
    items.forEach(function(item){
      var caption = extractCaption(item.product_text, item.page_number);
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('aria-label', 'View ' + caption + ' full size');

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      var img = document.createElement('img');
      img.src = item.image_url;
      img.alt = caption;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = function(){ thumb.classList.add('broken'); };
      thumb.appendChild(img);

      var body = document.createElement('div');
      body.className = 'card-body';
      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = caption;
      var page = document.createElement('div');
      page.className = 'card-page';
      page.textContent = 'Page ' + item.page_number;
      body.appendChild(title);
      body.appendChild(page);

      card.appendChild(thumb);
      card.appendChild(body);
      card.addEventListener('click', function(){ openLightbox(item.image_url, caption); });

      grid.appendChild(card);
    });
  }

  function openLightbox(url, caption){
    lbImg.src = url;
    lbImg.alt = caption;
    lbImg.classList.remove('zoomed');
    lbCaption.textContent = caption;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
  }

  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox || e.target.classList.contains('lightbox-inner')) closeLightbox();
  });
  lbImg.addEventListener('click', function(){ lbImg.classList.toggle('zoomed'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  function fetchItems(query){
    var seq = ++requestSeq;
    if(currentController) currentController.abort();
    currentController = new AbortController();

    statusText.textContent = 'Searching…';
    renderSkeletons(12);

    var url = WEBHOOK_URL + '?q=' + encodeURIComponent(query || '');

    fetch(url, { signal: currentController.signal })
      .then(function(res){
        if(!res.ok) throw new Error('Request failed');
        return res.json();
      })
      .then(function(data){
        if(seq !== requestSeq) return;
        var items = Array.isArray(data) ? data : [];
        if(items.length === 0){
          statusText.innerHTML = query ? '0 results' : 'No products found';
          renderEmpty(query);
          return;
        }
        statusText.innerHTML = '<strong>' + items.length + '</strong>' + (items.length === 1 ? ' item' : ' items') + (query ? ' matching "' + escapeHtml(query) + '"' : ' in the catalogue');
        renderItems(items);
      })
      .catch(function(err){
        if(err.name === 'AbortError') return;
        if(seq !== requestSeq) return;
        statusText.textContent = 'Something went wrong';
        renderError();
      });
  }

  searchInput.addEventListener('input', function(){
    clearBtn.classList.toggle('show', !!searchInput.value);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function(){
      fetchItems(searchInput.value.trim());
    }, 320);
  });

  clearBtn.addEventListener('click', function(){
    searchInput.value = '';
    clearBtn.classList.remove('show');
    searchInput.focus();
    fetchItems('');
  });

  fetchItems('');
})();
</script>

</body>
</html>
